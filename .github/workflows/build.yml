name: Build

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - '*.md'
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - '*.md'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            EXTRA_GRADLE_ARGS: apiCheck :test:proguard:r8jar
          - os: macos-latest
            EXTRA_GRADLE_ARGS: >-
              :mordant:compileNativeMainKotlinMetadata
              :mordant:compilePosixMainKotlinMetadata
              :mordant:compileAppleMainKotlinMetadata
              :mordant:compileMacosMainKotlinMetadata
              :mordant:compileWatchosMainKotlinMetadata
              :mordant:compileTvosMainKotlinMetadata
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 22
          distribution: 'graalvm-community'
          set-java-home: false
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 22
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Run tests
        run: >-
            ./gradlew
            ${{matrix.EXTRA_GRADLE_ARGS}}
            :mordant:check
            :mordant-coroutines:check
            :mordant-markdown:check
            :test:graalvm:nativeTest
            --stacktrace
      - name: Run R8 Jar
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: java -jar test/proguard/build/libs/main-r8.jar
      - name: Upload the build report
        if: failure()
        uses: actions/upload-artifact@master
        with:
          name: build-report-${{ matrix.os }}
          path: '**/build/reports'

  build-jvm-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 22
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Build JVM jar with Java 22
        run: ./gradlew publishToMavenLocal -PVERSION_NAME="${{github.sha}}" --no-configuration-cache

      - name: Upload maven local
        uses: actions/upload-artifact@v5
        with:
          name: m2-repo
          path: ~/.m2/repository
          retention-days: 1

  test-jvm-compatibility:
    needs: build-jvm-jar
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
      - name: Download JVM jar
        uses: actions/download-artifact@v6
        with:
          name: m2-repo
          path: ~/.m2/repository
      - name: Run the test project
        shell: 'script -q -e -c "bash {0}"'
        run: |
          cd test/jvm-smoke-tests
          ./gradlew test -PVERSION_NAME="${{github.sha}}"

  publish-snapshot:
    needs: [test, test-jvm-compatibility]
    runs-on: macos-latest
    if: ${{ github.ref == 'refs/heads/master' && github.repository == 'ajalt/mordant' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 22
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      - name: Deploy to sonatype
        # disable configuration cache due to https://github.com/gradle/gradle/issues/22779
        run: ./gradlew publishToMavenCentral -PsnapshotVersion=true --no-configuration-cache
    env:
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx12g -Dfile.encoding=UTF-8" -Dorg.gradle.configureondemand=true -Dorg.gradle.parallel=false -Dkotlin.incremental=false -Dorg.gradle.project.kotlin.incremental.multiplatform=false -Dorg.gradle.project.kotlin.native.disableCompilerDaemon=true
